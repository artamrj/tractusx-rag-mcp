<text x="22" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">Registration is a POST /shell-descriptors call against your own DTR instance. In Catena-X every</tspan></text>
