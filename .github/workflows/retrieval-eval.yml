# Manually triggered, free retrieval benchmark: ingests the real Tractus-X docs with the in-process embedding model
# and runs the 60-question test set in retrieval-only mode (no Claude/OpenAI calls). The report is uploaded as artifact.
name: Retrieval eval

on:
  workflow_dispatch:
    inputs:
      configs:
        description: Retrieval configurations (mode:topK, comma separated)
        default: vector:6,hybrid:6,vector:10,hybrid:10

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: ragtractusx
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 10
    env:
      EMBEDDING_PROVIDER: local
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -q -DskipTests package
      - run: java -jar target/rag-tractusx.jar --ingest
      - run: java -jar target/rag-tractusx.jar --eval --eval.retrieval-only "--eval.configs=${{ inputs.configs }}" --eval.out=target/eval
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: target/eval
