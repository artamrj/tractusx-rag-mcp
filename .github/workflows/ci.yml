name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests (pgvector, local embedding model, stub LLM).
      # Tests that call Claude/OpenAI (-Plive) or download the docs (-Pmanual) are not run here.
      - run: ./mvnw -B verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-tractusx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - run: helm lint deploy/helm/rag-tractusx --strict
      - name: Validate rendered manifests
        run: |
          for flags in "" "--set metrics.serviceMonitor.enabled=true --set metrics.grafanaDashboard.enabled=true --set ingress.enabled=true --set autoscaling.enabled=true" \
                       "--set postgres.enabled=false --set externalDatabase.url=jdbc:postgresql://db:5432/rag --set secrets.existingSecret=rag"; do
            helm template ci deploy/helm/rag-tractusx $flags | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
