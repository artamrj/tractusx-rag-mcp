{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag.fullname" . }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  RAG_API_KEY: {{ .Values.secrets.ragApiKey | quote }}
  ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  DB_PASSWORD: {{ (ternary .Values.postgres.password .Values.externalDatabase.password .Values.postgres.enabled) | quote }}
{{- end }}
