{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rag.fullname" . }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rag.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- if .Values.metrics.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag.fullname" . }}-dashboard
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    {{- toYaml .Values.metrics.grafanaDashboard.labels | nindent 4 }}
data:
  rag-tractusx.json: |-
    {{- .Files.Get "files/rag-tractusx-dashboard.json" | nindent 4 }}
{{- end }}
