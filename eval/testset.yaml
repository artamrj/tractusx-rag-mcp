# Evaluation test set: 60 questions over the Eclipse Tractus-X docs (KIT release 26.09 + developer/community docs).
#
# Drafted on 2026-10-29 from the real corpus (each answer was checked against the page text), then to be reviewed
# by a human: set `reviewed: true` once an item is checked. The eval report prints how many are still unreviewed.
#
# Fields
#   category          factual | procedural | cross-kit (needs 2+ pages) | unanswerable (docs do not cover it)
#   expected_sources  repo paths of every page that contains the answer (KIT release folder is ignored when matching)
#   key_points        atomic facts a correct answer must contain (graded by the LLM judge)
#   evidence          short quote for the reviewer (not used by the eval)
#   review_note       open question for the reviewer

# ---- part A ----
- id: A01
  reviewed: false
  question: "I want to grant access to a dataset if the consumer meets either one condition or another. Can I express that OR inside a single Catena-X policy, and how are multiple constraints combined?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/connector-kit/adoption-view/policies-in-catena.md"
  reference_answer: "Within one policy, multiple constraints are chained with a logical AND, either by wrapping them in an odrl:and object or by listing them in the odrl:constraint property. Alternatives that should be evaluated as a logical OR are not modelled inside one policy; instead the provider publishes them as separate contract offers for the same dataset, and the consumer picks the offer whose terms it wants to negotiate."
  key_points:
    - "Multiple constraints in one policy are combined with logical AND"
    - "AND-chaining is done via an odrl:and object or a list in the odrl:constraint property"
    - "OR alternatives must be published as separate contract offers"
  evidence: "Constraints that are supposed to be checked with a logical *OR* should be published as separate contract offers."

- id: A02
  reviewed: false
  question: "In the Data Trust & Security setup, who is who? What does an attestation provider actually do, and does it take over responsibility for the data from the supplier?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/data-trust-and-security-kit/adoption-view.md"
  reference_answer: "The KIT defines three roles: the data provider stores and provides the (verifiable or non-verifiable) data via the dataspace, the attestation provider is an additional independent entity that validates, verifies and certifies data, and the data consumer consumes the data and triggers the check whether it is verifiable. The attestation provider does not take over responsibility: the primary responsibility for the data remains with the data provider. Attestation providers need a verified identity and a verifiable role attestation awarded by a governance body so the chain of trust can be checked."
  key_points:
    - "Three roles: data provider, attestation provider, data consumer"
    - "Attestation provider is an independent entity that validates/verifies and certifies data"
    - "Primary responsibility for the data remains with the data provider"
    - "Attestation providers need a verified identity and role attestation from a governance body (chain of trust)"
  evidence: "However, the primary responsibility for the data must remain with the data provider"

- id: A03
  reviewed: false
  review_note: "Also lists a PURIS page with a near-identical DTR asset example; drop it if sources should stay in the core KITs."
  question: "How should I register my Digital Twin Registry as an asset in my EDC so partners can find it in my catalog and run lookups against it through the data plane?"
  lang: en
  category: procedural
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/digital-twin-kit/software-development-view/software-development-view.md"
    - "docs-kits_versioned_docs/version-26.09/kits/puris-kit/software-development-view/software-development-view.md"
  reference_answer: "Create an EDC asset whose properties set dct:type to https://w3id.org/catenax/taxonomy#DigitalTwinRegistry (cx-taxo:DigitalTwinRegistry) and cx-common:version to \"3.0\", the AAS version. Use an HttpData dataAddress whose baseUrl points to the DTR API but ends before the /shell-descriptors and /lookup segments, with proxyPath \"true\" and proxyQueryParams \"true\" (needed for the /lookup query parameters). Set proxyMethod to \"false\" so the data plane turns all incoming requests into GET and partners cannot change your registry. Consumers can then filter your catalog on dct:type DigitalTwinRegistry."
  key_points:
    - "dct:type = cx-taxo:DigitalTwinRegistry (https://w3id.org/catenax/taxonomy#DigitalTwinRegistry)"
    - "cx-common:version = 3.0"
    - "baseUrl must end before the /shell-descriptors and /lookup segments; proxyPath and proxyQueryParams true"
    - "proxyMethod false so only GET requests reach the DTR"
  evidence: "it's critical that the URL inserted here must end before the /shell-descriptors and /lookup segments."

- id: A04
  reviewed: false
  review_note: "CCM page describes 3 trust levels but notes the current data model still uses 4; answer mentions both."
  question: "For company certificates in CCM, what is the practical difference between the low, medium and high trust levels?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/company-certificate-management-kit/adoption-view/adoption-view.md"
  reference_answer: "At the low (unverified) level, the provider shares a PDF certificate plus structured data in the Catena-X model, with no app needed and no verification performed. The medium level requires a Catena-X certified business application and at least one optional validation, such as OCR comparison of the PDF with the structured data or a cross-check against external databases or services (e.g. NQC, Ariba). The high (issuer-verified) level validates the certificate directly through an API or SSI interface to the issuing authority (e.g. TÜV, IATF, ENX), with OCR optional. The KIT notes that the current data model (26.03) still has four trust levels (none, low, high, trusted)."
  key_points:
    - "Low: PDF plus structured data shared via standard EDC flow, no verification"
    - "Medium: certified business application plus optional validation such as OCR or third-party database cross-check"
    - "High: validated directly via an API or SSI interface to the issuing authority"
    - "The current data model (26.03) still uses four trust levels: none, low, high, trusted"
  evidence: "An interface (API or SSI) to an issuing authority (e.g., Issuer: TÜV, IATF, ENX) is used to validate the certificate directly."

- id: A05
  reviewed: false
  question: "When I create the digital twin of a serialized part for Industry Core, which specificAssetIds do I have to set, and which ones are optional?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/industry-core-kit/software-development-view/digital-twins.mdx"
  reference_answer: "Every Industry Core twin needs manufacturerId (the manufacturer's BPNL), manufacturerPartId and digitalTwinType, which is \"PartInstance\" for serialized parts. Serialized parts also need partInstanceId (the serial number applied to the part) and intrinsicId, the unified technical lookup key, which here takes the partInstanceId value. customerPartId is optional but required if the manufacturer knows it, and van (pseudonymized VIN) is optional and only for vehicles."
  key_points:
    - "Mandatory for all twins: manufacturerId (BPNL), manufacturerPartId, digitalTwinType"
    - "digitalTwinType is PartInstance for serialized parts"
    - "Serialized parts additionally require partInstanceId and intrinsicId (= partInstanceId)"
    - "customerPartId optional (should be added if known); van optional, vehicles only"
  evidence: "Mandatory specific asset IDs ensure that at least this information is available for the digital twin."

- id: A06
  reviewed: false
  question: "Wir lassen ein Bauteil bei einem Auftragsfertiger produzieren. In wessen Digital Twin Registry wird der digitale Zwilling angelegt, wem gehört er, und muss der Auftragsfertiger selbst bei Catena-X sein?"
  lang: de
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/industry-core-kit/software-development-view/digital-twins.mdx"
  reference_answer: "The contracting authority and the contract manufacturer must first agree on creating the twin. Whichever party creates it, the twin must be created in the contracting authority's DTR, so the contracting authority always owns the twin. The contract manufacturer need not be a Catena-X member. If it is not, it provides the data outside Catena-X, and the contracting authority creates the twin and looks up the child parts. All communication, such as quality notifications, goes through the contracting authority."
  key_points:
    - "The twin is always created in the contracting authority's DTR, regardless of who creates it"
    - "The contracting authority is the owner of the twin"
    - "The contract manufacturer does not need to be a Catena-X member"
    - "Communication such as quality notifications goes through the contracting authority"
  evidence: "Regardless of who of the two parties creates the digital twin, it must always be created in the contracting authority's DTR."

- id: A07
  reviewed: false
  review_note: "Docs disagree on the IRS chart name, so the answer does not name it."
  question: "I'd like to try the Item Relationship Service on my own machine. What do I need installed and what are the steps to get a local instance running?"
  lang: en
  category: procedural
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/data-chain-kit/software-operation-view.md"
    - "docs-kits_versioned_docs/version-26.09/kits/data-chain-kit/documentation/admin-guide.md"
  reference_answer: "Prerequisites are Docker with at least 8GB of memory, helm, a running Kubernetes cluster (e.g. Minikube) and kubectl. Add the IRS Helm repository (helm repo add irs https://eclipse-tractusx.github.io/item-relationship-service), then install the chart with your values file via helm install. Check the release with helm list and kubectl get pods; two pods should run, IRS and Minio. Then port-forward the IRS service to 8080 and use the Swagger UI at http://localhost:8080/api/swagger-ui/index.html, where the local setup uses mocked test data."
  key_points:
    - "Prerequisites: Docker (>= 8GB memory), helm, a Kubernetes cluster such as Minikube, kubectl"
    - "Add the IRS Helm repo and install the chart with a values file via helm install"
    - "Two pods should be running: IRS and Minio"
    - "Port-forward to 8080 and use the Swagger UI to test"
  evidence: "there should be two pods deployed - IRS and Minio"

- id: A08
  reviewed: false
  question: "Our IRS jobs skip some suppliers' parts instead of fetching their data. How does IRS decide which contract offers it is willing to negotiate, and where do I configure that?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/data-chain-kit/documentation/admin-guide.md"
    - "docs-kits_versioned_docs/version-26.09/kits/data-chain-kit/documentation/arc42.md"
    - "docs-kits_versioned_docs/version-26.09/kits/data-chain-kit/adoption-view.md"
  reference_answer: "IRS checks the policies of each offered contract against the accepted policies in its Policy Store and only negotiates offers that match. Non-matching offers are declined, no data is consumed, and a tombstone is created for that node. Policies are managed through the Policy Store REST API (/irs/policies, admin role). If no custom policies are registered, IRS falls back to the default configured in irs-edc-client.catalog.acceptedPolicies. The Policy Store is persisted in an S3-compatible store such as Minio."
  key_points:
    - "IRS validates contract offer policies against the Policy Store and only negotiates matching offers"
    - "Non-matching offers are declined/no data consumed (tombstone for that node)"
    - "Policies are managed via the Policy Store REST API (/irs/policies)"
    - "Without custom policies, the default irs-edc-client.catalog.acceptedPolicies is used"
  evidence: "IRS will only negotiate contracts for offers with policies found in Policy Store."

- id: A09
  reviewed: false
  question: "As a traceability app provider, how do I publish my endpoint for receiving quality alerts through the connector so that partners' apps can find it and are allowed to use it?"
  lang: en
  category: procedural
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/traceability-kit/software-development-view/app-provider.mdx"
  reference_answer: "Register the notification endpoint as an EDC data asset with dct:type cx-taxo:ReceiveQualityAlertNotification and cx-common:version set to the Notification API version, so partners can filter for it. You may restrict visibility with an access policy (Membership or specific BPNs). The usage policy must include the FrameworkAgreement constraint (Data Exchange Governance) and the qualityNotifications usage purpose (e.g. cx.core.qualityNotifications:1); a ContractReference constraint is optional. Version 1.2.1 of the Notification API is mandatory, 2.0.0 optional, so multiple endpoint assets may be published in parallel."
  key_points:
    - "Create an EDC asset with dct:type ReceiveQualityAlertNotification and cx-common:version = API version"
    - "Access policy can restrict visibility to Membership or specific BPNs"
    - "Usage policy must contain FrameworkAgreement and the qualityNotifications UsagePurpose"
    - "Notification API 1.2.1 is mandatory (2.0.0 optional)"
  evidence: "The notification endpoint providers must set properties `dct:type` and `cx-common:version` which are used to classify the asset"

- id: A10
  reviewed: false
  question: "Our supplier found a defect in batches it already delivered to us. Which type of traceability notification should it send, and how does that differ from the one we would send when we suspect a problem with supplied parts?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/traceability-kit/software-development-view/app-provider.mdx"
    - "docs-kits_versioned_docs/version-26.09/kits/traceability-kit/adoption-view.mdx"
  reference_answer: "The supplier should send a quality alert, a notification sent bottom-up from a supplier to its direct customers. It describes identified quality issues in delivered serialized parts or batches and lists the affected parts. When a customer suspects a problem, it sends a quality investigation top-down to its direct suppliers, asking them to investigate the affected parts and narrow down the cause. Both reference the affected parts by their Catena-X Unique IDs."
  key_points:
    - "Supplier-to-customer (bottom-up) notification is a quality alert"
    - "Customer-to-supplier (top-down) notification is a quality investigation"
    - "A quality alert describes identified issues and lists the affected serialized parts or batches"
    - "Affected parts are referenced by Catena-X Unique IDs"
  evidence: "**Quality investigations** refer to sending standardized notifications to direct suppliers (top-down) while **Quality Alerts** refer to sending notifications to direct customers (bottom-up)."

- id: A11
  reviewed: false
  question: "What verifiable credentials do we need in our wallet to talk to the BPDM Gate and to the BPDM Pool over EDC?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/business-partner-kit/documentation-bpdm/bpdm-arc42.md"
  reference_answer: "Both cases require a verifiable credential for the BPDM Framework Agreement in the wallet, which is verified during EDC communication. Uploading to and downloading from the Gate also requires validating the BPN credential, so only the sharing member can access its own Gate. Downloading from the Pool also requires validating the Membership credential, so only onboarded Catena-X members can access the Pool. The usage purposes starting with cx.bpdm.gate and cx.bpdm.pool are checked as well."
  key_points:
    - "Both Gate and Pool require a BPDM Framework Agreement credential"
    - "Gate additionally checks the BPN credential so only the sharing member accesses its own Gate"
    - "Pool additionally checks the Membership credential so only onboarded members access it"
    - "Usage purposes cx.bpdm.gate / cx.bpdm.pool are checked"
  evidence: "the Membership Credential needs to be validated to ensure that only onboarded catena-x members have access to the pool."

- id: A12
  reviewed: false
  question: "As a buyer, how do I fetch a supplier's ISO 9001 certificate on demand using the CCM API? Walk me through the flow."
  lang: en
  category: procedural
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/company-certificate-management-kit/development-view/architecture.md"
    - "docs-kits_versioned_docs/version-26.09/kits/company-certificate-management-kit/development-view/ccm-api-guide.md"
  reference_answer: "This is the consumer-driven PULL mechanism. The provider publishes the certificate as an EDC asset (subject cx-taxo:CompanyCertificate, type cx-taxo:Submodel, semantic ID urn:samm:io.catenax.business_partner_certificate:3.1.0). The consumer can call POST /companycertificate/request with certifiedBpn, certificateType and optional locationBpns. The provider returns IN_PROGRESS (202), COMPLETED with a documentId (200), or REJECTED with errors, and the consumer polls the same endpoint because the provider never calls back. With the documentId (the EDC asset ID), the consumer finds the asset in the provider's catalog, negotiates a contract, gets an EDR, retrieves the certificate via the data plane, and can send feedback via /companycertificate/status (RECEIVED, ACCEPTED, REJECTED)."
  key_points:
    - "Consumer sends POST /companycertificate/request with certifiedBpn, certificateType (and optional locationBpns)"
    - "Provider responds IN_PROGRESS, COMPLETED (with documentId) or REJECTED; the consumer polls, there is no callback"
    - "documentId is the EDC asset ID used to find the asset in the catalog, negotiate and pull via the data plane"
    - "Consumer can send feedback via /companycertificate/status"
  evidence: "After `COMPLETED`, Consumer uses the `documentId` to search the Provider's EDC catalog and retrieves the certificate via the EDC data plane."

- id: A13
  reviewed: false
  question: "We're onboarding to Industry Core. Which usage policy constraints should go on the offer for our Digital Twin Registry versus the offers for our aspect submodels, and which of these constraints is actually verified against the consumer's credentials?"
  lang: en
  category: cross-kit
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/industry-core-kit/software-development-view/policies.mdx"
    - "docs-kits_versioned_docs/version-26.09/kits/digital-twin-kit/software-development-view/software-development-view.md"
    - "docs-kits_versioned_docs/version-26.09/kits/connector-kit/adoption-view/policies-in-catena.md"
  reference_answer: "Offer the DTR with the usage purpose cx.core.digitalTwinRegistry:1 plus an active Membership constraint, and no use-case-specific FrameworkAgreement, because it serves all use cases and should appear once in the catalog. Offers for aspect submodels use the Industry Core purpose cx.core.industrycore:1. Since Industry Core has no Framework Agreement of its own, chain that purpose with the use case's FrameworkAgreement constraint. During negotiation, the FrameworkAgreement constraint is checked against the consumer's DataExchangeGovernanceCredential in its verifiable presentation. Usage purposes are not checked against VCs; only the consumer's consent to the policy is needed."
  key_points:
    - "DTR offer: purpose cx.core.digitalTwinRegistry:1 plus Membership, no use-case FrameworkAgreement"
    - "Submodel/aspect offers: purpose cx.core.industrycore:1"
    - "Industry Core has no own Framework Agreement; the purpose is chained with a use-case FrameworkAgreement constraint"
    - "FrameworkAgreement is verified against the DataExchangeGovernanceCredential; usage purposes are not checked against VCs"
  evidence: "it should be exposed only with the purpose `cx.core.digitalTwinRegistry:1`."

- id: A14
  reviewed: false
  question: "I've self-issued a verifiable credential that wraps our PCF aspect for a product. How do I attach it to the product's digital twin so consumers recognise it as a credential and can fetch it through the connector?"
  lang: en
  category: cross-kit
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/data-trust-and-security-kit/software-development-view/digital-twins.md"
    - "docs-kits_versioned_docs/version-26.09/kits/digital-twin-kit/software-development-view/software-development-view.md"
  reference_answer: "Register the credential as an extra submodel descriptor on the twin, store the credential payload in a submodel service, and create the connector asset, policies and contract definition for it. Mark it as a credential with a layered semanticId: Entity for the VC data model version, DataElement for the credential type (e.g. DataAttestationCredential), Submodel for the embedded aspect model (e.g. urn:samm:io.catenax.pcf:7.0.0#Pcf), and Operation for the signature type. The endpoint href points to the data plane with a /credential path, and subprotocol DSP, as in the Digital Twin KIT. Its subprotocolBody holds the connector asset id and the dspEndpoint of the control plane, used for catalog lookup and negotiation."
  key_points:
    - "Register the VC as a submodel descriptor in the DTR and back it with a connector asset, policies and contract"
    - "semanticId keys: Entity (VC version), DataElement (VC type), Submodel (aspect model), Operation (signature type)"
    - "href points to the data plane with a /credential path"
    - "subprotocol DSP with subprotocolBody containing the asset id and the dspEndpoint (control plane URL)"
  evidence: "the `semanticId` must specify from top to down the different metadata abstraction levels."

# ---- part B ----
- id: B01
  reviewed: false
  question: "As a supplier, a few variants in one of my capacity groups tie up the line far longer than the others, and I plan capacity in machine cycles while my customer sends demand in pieces. Can DCM cope with that, and how?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/demand-and-capacity-management-kit/adoption-view/use-case/load-factors.md"
    - "docs-kits_versioned_docs/version-26.09/kits/demand-and-capacity-management-kit/adoption-view/qna.md"
    - "docs-kits_versioned_docs/version-26.09/kits/demand-and-capacity-management-kit/adoption-view/glossary.md"
  reference_answer: "Yes. DCM offers Load Factors, an optional feature that only the supplier applies inside the WeekBasedCapacityGroup: a numerical factor per linked material demand that scales the weekly demand to reflect variants that load the line more or less (e.g. 3.5 multiplies the demand by 3.5; a factor of 1 is neutral). Load Factors also act as conversion factors, converting the unit of measure of the WeekBasedMaterialDemand into the capacity group's unit, i.e. time (seconds) or cycles. If the supplier uses them, a Load Factor must be assigned to every WeekBasedMaterialDemand linked to that capacity group."
  key_points:
    - "Load Factors are an optional, supplier-defined feature applied within the WeekBasedCapacityGroup"
    - "A Load Factor multiplies the weekly demand (1 is neutral; e.g. 3.5 multiplies demand by 3.5)"
    - "Load Factors can convert the demand's unit of measure into time (seconds) or cycles"
    - "If used, every WeekBasedMaterialDemand linked to the capacity group must get a Load Factor"
  evidence: "A Load Factor of 1 is neutral and does not change the linked WeekBasedMaterialDemand."

- id: B02
  reviewed: false
  question: "We ship the same part to several OEMs out of one shared production line and warehouse. What do we have to watch out for when sharing stock and planned output with each of these customers via PURIS?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/puris-kit/adoption-view/integration-scenarios/multi-customer-scenario.md"
    - "docs-kits_versioned_docs/version-26.09/kits/puris-kit/adoption-view/business-value.md"
  reference_answer: "Even when production and stock are shared, the data must be allocated to each customer's context. The KIT suggests allocating planned production output and item stock based on customer orders/call-offs, short-term material demand (CX-0120) or scheduled deliveries (CX-0118), and for item stock using ratios or quotations based on call-offs so total inventory is not disclosed. Capacities or deliveries of other customers, total call-offs or deliveries across all customers, and total supplier stock or stock allocated to other customers must not be shared or made inferable. Each participant is responsible for legal compliance; the standard does not validate it."
  key_points:
    - "Data must be allocated/separated per customer even if production or stock is shared"
    - "Allocation can be based on orders/call-offs, short-term material demand or scheduled deliveries; item stock via ratios or quotations from call-offs"
    - "Other customers' capacities/deliveries, totals across all customers and total supplier stock must not be shared or inferable"
    - "The data provider is responsible for legal compliance; the standard does not validate it"
  evidence: "Accordingly, the following information must not be shared or made inferable:"

- id: B03
  reviewed: false
  question: "I want to track where a shipment is via GPS and what is packed on a pallet through Catena-X. Which digital twins and aspect models does the logistics KIT give me for that?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/logistics-kit/adoption-view.md"
  reference_answer: "The Logistics KIT defines a digital twin for a Transport Unit, which is needed when using a Global Transport Label or tracking a transport unit and providing data such as its packing list, and a digital twin for the Transport itself, e.g. to provide GPS data. Its aspect models are PackingList (the packed goods inside a transport unit), IotSensorData (tracked returnable packages and assets, monitoring the quality of critical materials) and GlobalTransportLabel (the GTL in digital form)."
  key_points:
    - "A 'Transport Unit' digital twin is used for a Global Transport Label or tracking a transport unit, e.g. with packing list data"
    - "A 'Transport' digital twin can be used to track the transport, e.g. with GPS data"
    - "Aspect models: PackingList, IotSensorData and GlobalTransportLabel"
  evidence: "In case of tracking the transport and provide data e.g. about GPS data, using a digital twin for transport is possible."

- id: B04
  reviewed: false
  question: "When a buyer's request for a machined part is passed to a supplier through a manufacturing-on-demand platform, what AAS submodels is that request expected to carry?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/manufacturing-as-a-service-kit/adoption-view.md"
  reference_answer: "In the MaaS KIT the buyer's request is formalized as an initial Asset Administration Shell for the product that includes a Purchase Order submodel, enabling the supplier to analyze the production process and calculate price and delivery date automatically. The mandatory AAS submodels for the request are Purchase Order, Digital Nameplate, Technical Data and Handover Documentation; the same set is used for the offer and the order."
  key_points:
    - "The request is formalized as an initial AAS for the product including a Purchase Order submodel"
    - "Mandatory submodels: Purchase Order, Digital Nameplate, Technical Data, Handover Documentation"
    - "The same submodels are used for offer and order"
  evidence: "First, the request is now formalized in an initial Asset Administration Shell (AAS) for the product, including a 'Purchase Order' submodel."

- id: B05
  reviewed: false
  question: "Welche Kommunikationsmodi kann ein Kunde wählen, wenn er über den Shop-Floor-Information-Service eine Produktionsprognose anfragt, und wie beendet er laufende Updates wieder?"
  lang: de
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/modular-production-kit/adoption-view.md"
  reference_answer: "The customer selects the communicationMode in the GetProductionForecastData request: synchronous (Modular Production immediately sends the requested information back), cyclic (the forecast is sent periodically, e.g. every day) or notification (the customer is informed when the production forecast changes). The answers are sent as ProvideProductionForecastData, linked to the request via its messageId. For the cyclic and notification modes the customer must unsubscribe once no further forecasts are needed; the unsubscribe call is a simple HTTP DELETE without its own data model."
  key_points:
    - "Three communication modes: synchronous, cyclic and notification"
    - "Synchronous = immediate reply; cyclic = periodic (e.g. daily); notification = when the forecast changes"
    - "Forecasts are returned via ProvideProductionForecastData"
    - "For cyclic/notification mode the customer unsubscribes with a plain HTTP DELETE"
  evidence: "The cyclic mode sends the information periodically (e.g. every day), whereas the notification mode informs if the forecast for the production has changed."

- id: B06
  reviewed: false
  question: "For tracing recycled material from end-of-life vehicles back into production, which semantic models does the material accounting KIT define, and on which existing Industry Core models do they build?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/material-accounting-kit/adoption-view/adoption-view.md"
    - "docs-kits_versioned_docs/version-26.09/kits/material-accounting-kit/development-view/development-view.md"
  reference_answer: "Material Accounting defines six aspect models: VehicleInformation (the vehicle at end-of-life), Composition (how components and materials are grouped, e.g. material weight in a part), Material (material classification and characteristics), RecyclingInformation (primary/secondary and pre-/post-consumer material shares and origin), WasteCode (waste classification based on the European Waste Code) and RecyclingBatch (process and batch-level data such as transport, weighing and treatment steps). They extend the Industry Core models PartInstance (SerialPart) and SingleLevelBomAsBuilt, which identify physical assets and link vehicles, components and materials. The models are specified in the Material Accounting standard CX-0159."
  key_points:
    - "Six aspect models: VehicleInformation, Composition, Material, RecyclingInformation, WasteCode, RecyclingBatch"
    - "They build on the Industry Core models PartInstance (SerialPart) and SingleLevelBomAsBuilt"
    - "RecyclingBatch captures process/transaction data such as transport, weighing and treatment"
    - "The standard is CX-0159 Material Accounting"
  evidence: "At the center of the architecture, the PartInstance (SerialPart) and SingleLevelBomAsBuilt models from the Industry Core establish the structural foundation"

- id: B07
  reviewed: false
  question: "When sharing a 3D CAD assembly with a partner, should the hierarchy of sub-geometries go into the scene node aspect or into the single-level BOM? What is the difference between the two?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/geometry-kit/adoption-view.md"
  reference_answer: "SingleLevelSceneNode describes the spatial/geometric structure inside a single digital twin: its childItems may only reference other scene nodes of the same twin (i.e. provided by the same participant), and it carries geometry references, transformations and bounding volumes used for visualization, simulation or DMU. SingleLevelBOM describes the logical product structure across multiple digital twins, with child items pointing to the Catena-X IDs of other twins, possibly from other business partners. So the internal geometric hierarchy belongs in the scene node, while cross-twin/cross-partner assembly relations belong in the BOM; combined they represent both geometry and the multi-partner assembly hierarchy."
  key_points:
    - "SingleLevelSceneNode models the spatial/geometric structure within one digital twin; its childItems only reference scene nodes of the same twin"
    - "Scene nodes carry geometry references, transformations and bounding volumes"
    - "SingleLevelBOM connects multiple digital twins (possibly from different partners) into a logical product structure"
    - "The two models are complementary"
  evidence: "In short, SingleLevelSceneNode connects geometry within one digital twin, whereas SingleLevelBOM connects multiple digital twins with each other."

