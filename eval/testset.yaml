- id: C05
  reviewed: false
  question: "As a small supplier going through the Catena-X Due Diligence Check, how is it decided whether I just fill in a self-assessment questionnaire or have to undergo an audit?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/due-diligence-check-kit/adoption-view/adoption-view.md"
  reference_answer: "The Service and Solution Provider combines country and sector risk data from the shared risk register (provided by the Standard Setter) with the company's size into a risk classification, assigning one of three levels: R1 (low), R2 (medium) or R3 (high). Medium-risk companies (e.g. R2) must complete and sign a Self-Assessment Questionnaire, which the SSP evaluates and for which the SME defines preventive measures. High-risk companies (e.g. R3) may require an audit, after which the SME develops a corrective action plan with target dates; a verified incident can escalate a company, e.g. from R2 to R3."
  key_points:
    - "SSP creates a combined risk and company-size classification based on the shared country and sector risk register"
    - "Three levels: R1 low, R2 medium, R3 high risk"
    - "Medium risk (e.g. R2) requires a Self-Assessment Questionnaire"
    - "High risk (e.g. R3) may require an audit with a corrective action plan incl. target dates"
  evidence: "For companies classified as medium risk (e.g., R2), completion of a Self-Assessment Questionnaire (SAQ) is required."

- id: C06
