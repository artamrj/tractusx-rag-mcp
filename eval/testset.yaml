    - "docs-kits_versioned_docs/version-26.09/kits/knowledge-agents-kit/software-development-view/api/agent/get.mdx"
  reference_answer: "A skill is registered by posting the parameterized SPARQL query (Content-Type application/sparql-query) to the agent plane's /api/agent/skill endpoint with the skill asset name, optionally with distributionMode, contract and isFederated. It is invoked via /api/agent?asset=<skill asset>, passing the VINs as bindings in an application/sparql-results+json body. The runMode parameter selects where it runs: provider executes it in the remote partner's environment (using a global asset id prefixed with the partner connector's URL), consumer downloads and runs it locally, and all (default) lets the agent choose based on contracts and policies."
