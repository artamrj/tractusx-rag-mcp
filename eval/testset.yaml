- id: B12
  reviewed: false
  review_note: "Answer is spread over 5 pages; recall for this item will look low even when the answer is fine."
  question: "One of our plants is hit by a strike and we can't yet tell how long output will be reduced. Should we just push updated numbers through DCM or PURIS, or send a disruption notification, and what is each of these meant for?"
  lang: en
  category: cross-kit
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/supply-chain-disruption-notification-kit/adoption-view.md"
    - "docs-kits_versioned_docs/version-26.09/kits/demand-and-capacity-management-kit/adoption-view/overview.md"
    - "docs-kits_versioned_docs/version-26.09/kits/demand-and-capacity-management-kit/adoption-view/use-case/disruption-notification.md"
