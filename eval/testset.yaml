    - "Indirect (Ln) partners receive only anonymized information (title/description, category, status) plus their distance to L0"
    - "The originator's (L0) identity and the supply-chain path are not communicated or documented"
  evidence: "They will receive from the previous business partner (L~n-1~) the anonymized incident information (anonymized title & description, category, status, etc.)"

