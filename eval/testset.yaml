- id: C10
  reviewed: false
  question: "Isn't it risky to let partners run SPARQL-based skills against our backend with Knowledge Agents? What protects our data?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/knowledge-agents-kit/adoption-view/intro.md"
  reference_answer: "Only business partners with signed contracts (in certain roles) get access; a skill request from a non-authorized chain of computation cannot enter the backend. The backend is not exposed directly but sits behind a virtualization layer that maps different contracts to different security principals and data views. SPARQL provides a well-defined set of operations that can be checked in advance rather than arbitrary Turing-complete computations, and the compute-to-data approach shares only computation results instead of the underlying data."
  key_points:
    - "Access only for contracted business partners; unauthorized skill requests cannot reach the backend"
    - "A virtualization layer between agent and data source maps contracts to different security principals/data views"
    - "SPARQL offers a well-defined set of operations that can be validated in advance (no arbitrary ad-hoc computation)"
    - "Compute-to-data: only computation results are shared, not the full data"
  evidence: "KA follows a strict compute to data approach. Thus, by design only computation results are shared instead of copying all data relevant for this computation"

- id: C11
  reviewed: false
  question: "How is the recycled-material share of a single component calculated, and how does that roll up to a figure for the whole vehicle?"
  lang: en
  category: factual
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/circularity-kit/adoption-view.md"
  reference_answer: "The secondary material content (SMC) is the ratio of secondary material used to total material used at component level, expressed as a percentage. It is the sum of pre-consumer material content, post-consumer material content and, optionally, reutilization content (rework, regrind or scrap reused within the same process, which is excluded from pre-consumer material). The SMC is calculated for every component, and the secondary material quota (SMQ) is the vehicle-level KPI calculated from the individual components' SMCs."
  key_points:
    - "SMC = ratio of secondary material used to total material used, at component level (percentage)"
    - "SMC is the sum of pre-consumer, post-consumer and optional reutilization content"
    - "SMQ is the vehicle-level KPI calculated from the components' SMCs"
  evidence: "the secondary material content (SMC) is defined as the ratio between secondary material used and total material used on component level"

