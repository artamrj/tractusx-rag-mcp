# ---- part D ----
- id: D01
  reviewed: false
  question: "I'm containerizing a Java service that we will publish on DockerHub. Which base image am I supposed to use, and how specific should the tag in my FROM line be?"
  lang: en
  category: factual
  expected_sources:
    - "docs/release/trg-4/trg-4-02.md"
  reference_answer: "For Java/Kotlin/JVM-based images the aligned base image is Eclipse Temurin, preferring a JRE (and alpine) tag over a JDK, e.g. 21-jre-alpine. You must not reference a tag pointing to a patch version (e.g. alpine:3.18.5); use a tag with only the major or minor version so the image can be rebuilt with an updated base image without touching the Dockerfile. The base image should be used as-is, without running package-manager updates or installing extra packages, since that could pull in content with unclear IP/licensing."
  key_points:
    - "Java/JVM images use Eclipse Temurin as base image, preferring JRE (alpine) over JDK"
    - "Do not use a patch-version tag; use a major or minor version tag"
    - "Use the base image as-is: no package-manager upgrades or extra package installs"
  evidence: "Do not use an image tag pointing to a patch version of the image. Instead, use an image tag containing either minor or major version."

- id: D02
  reviewed: false
  question: "How should I set CPU and memory requests and limits in my product's Helm chart defaults?"
  lang: en
  category: factual
  expected_sources:
    - "docs/release/trg-5/trg-5-04.md"
  reference_answer: "The Helm chart must ship app-specific, sane default CPU and memory settings. For CPU, the limit should be about 2-3 times higher than the request; the request must not equal the limit, so the pod can use extra CPU when available. For memory, request and limit must be set equal, because memory is not a stretchable resource and Kubernetes kills pods that use more memory than expected."
  key_points:
    - "The chart must contain app-specific sane default CPU and memory settings"
    - "CPU limit about 2-3 times the CPU request (request not equal to limit)"
    - "Memory request and memory limit set equal"
  evidence: "Verify that memory request and limit are set equal."

- id: D03
  reviewed: false
  question: "Our repository hasn't had a product release in a long time. When can the committers deprecate it, and what does that actually mean for people still using our Helm charts and container images?"
  lang: en
  category: factual
  expected_sources:
    - "docs/release/trg-7/trg-7-09.md"
  reference_answer: "Committers can propose deprecation if a repository does not comply with the TRGs and/or Eclipse Foundation guidelines (security, IP, etc.), or, for product repositories, if the product was not released within the past year's major release cycle or the standards it uses changed in a major version in that cycle. Deprecation means the repository is archived (set to 'Public Archive' on GitHub); it stays accessible and can be reactivated. Helm charts and container images remain available and users are not informed about the deprecation. After the list is announced on the mailing list, project leads deprecate the repositories if no action is taken within 4 weeks."
  key_points:
    - "Deprecation means archiving the repository (Public Archive); it can be revived later"
    - "Criteria: non-compliance with TRGs/EF guidelines, or no product release / major standard change within the past year's major release cycle"
    - "Helm charts and container images remain available and users are not notified"
    - "If no action is taken within 4 weeks after the announcement, project leads deprecate the repository"
  evidence: "Additionally the helm charts and container images are still available and no information about the deprecation is passed to the user."

- id: D04
  reviewed: false
  question: "What can I do on the Tractus-X GitHub repos once I'm an official project contributor that I can't do with just a signed ECA?"
  lang: en
  category: factual
  expected_sources:
    - "docs/oss/contributor-committer.md"
  reference_answer: "Anyone with an Eclipse account and signed ECA is a contributor with only the GitHub read role. Official project contributors get the triage role, which lets them apply/dismiss labels, close, reopen and assign issues and pull requests, apply milestones, mark duplicates, request pull request reviews, and access the security tab. Write access (pushing code) remains reserved to committers."
  key_points:
    - "Plain contributors (signed ECA) have read access only"
    - "Official project contributors get the GitHub triage role"
    - "Triage allows managing labels/milestones, closing/reopening/assigning issues and PRs, marking duplicates and requesting PR reviews"
    - "Triage also grants access to the security tab"
  evidence: "Close, reopen, and assign all issues and pull requests"

- id: D05
  reviewed: false
  question: "My planned feature depends on another component and some things are still unclear. How do I get that discussed with the other teams before the release is planned?"
  lang: en
  category: factual
  expected_sources:
    - "docs/oss/release-process.md"
  reference_answer: "Unresolved questions and cross-component dependencies are handled at the Alignment Day, which precedes the Open Planning Day. Label the feature issue with 'open question' at least 3 days before the Alignment Day. The Alignment Day is not a planning or refinement session; it is a dedicated space to clarify uncertainties and dependencies, where feature owners describe their needs and component developers clarify what is expected from them."
  key_points:
    - "Add the 'open question' label to the feature"
    - "The label must be set at least 3 days before the Alignment Day"
    - "Alignment Day clarifies open questions/dependencies; it is not a planning or refinement session"
  evidence: "This is not a planning or refinement session — it's a dedicated space to clarify uncertainties, discuss dependencies"

- id: D06
  reviewed: false
  review_note: "Source kit-master-data-overview.mdx uses slightly different category names."
  question: "When I register a new KIT, which top-level architecture category does it have to go into, and what are the options?"
  lang: en
  category: factual
  expected_sources:
    - "documentation/kit-framework.mdx"
    - "docs/release/trg-10/trg-10-01.mdx"
    - "documentation/kit-master-data-overview.mdx"
  reference_answer: "Every KIT must be placed in one of four architecture categories: Dataspace Foundation (network basis for secure, sovereign data exchange, e.g. Connector KIT), Industry Core Foundation (common capabilities, data models and digital twin concepts shared by all use cases, e.g. Industry Core KIT), Cross-Industry Use Cases (business problems spanning industries such as sustainability or quality, e.g. PCF KIT), and Industry-Specific Use Cases (vertical needs such as shop floor operations). In addition to the category, a KIT is also assigned a domain (e.g. Sustainability, Engineering) for thematic grouping."
  key_points:
    - "A KIT must belong to one of four categories"
    - "The categories are Dataspace Foundation, Industry Core Foundation, Cross-Industry Use Cases and Industry-Specific Use Cases"
    - "A KIT additionally has a domain for functional/thematic classification"
  evidence: "KITs in Eclipse Tractus-X are organized into four main categories, each serving a specific purpose in the dataspace ecosystem:"

- id: D07
  reviewed: false
  question: "Keeping our DEPENDENCIES file current is a pain. Is there some shared automation for that, and who maintains it?"
  lang: en
  category: factual
  expected_sources:
    - "community/sigs/02_sig_infra.md"
  reference_answer: "Yes. The DEPENDENCIES file is generated with the Eclipse dash-licenses tool, and SIG Infra, the special interest group for automation topics like CI and release, maintains a run-dash GitHub action that helps keep the DEPENDENCIES file up to date. This supports legal compliance, which every Tractus-X repository has to take care of."
  key_points:
    - "SIG Infra maintains a run-dash GitHub action for this"
    - "The DEPENDENCIES file is generated by Eclipse dash-licenses"
    - "An up-to-date DEPENDENCIES file is part of legal compliance for every repo"
  evidence: "SIG infra is maintaining a run-dash GitHub action, that helps to ensure the DEPENDENCIES file stays up-to-date."

- id: D08
  reviewed: false
  question: "I need a Sonar project and some secrets set up for our repository. Where do I file that request, and does it need anything special if I'm not a committer?"
  lang: en
  category: factual
  expected_sources:
    - "docs/oss/issues.md"
  reference_answer: "Requests for Eclipse infrastructure, such as a Sonar project or repository secrets, go to the Eclipse Foundation Helpdesk issue tracker on GitLab. Start the issue summary with the prefix 'tractus-x:'. If you are not a committer, create the ticket and add a committer who gives a 'thumbs up' to approve it. Code- and development-related issues instead belong in the GitHub issues of the repository."
  key_points:
    - "File it in the Eclipse Foundation Helpdesk (GitLab)"
    - "Start the summary with the 'tractus-x:' prefix"
    - "Non-committers must add a committer to give a 'thumbs up' approval"
  evidence: "If you are not a committer, create the ticket and add a committer to request a \"thumbs up\" for approval"

- id: D09
  reviewed: false
  question: "I've been contributing for a while and a committer wants to nominate me. How does the path to committer actually work?"
  lang: en
  category: procedural
  expected_sources:
    - "docs/oss/committer-election-process.md"
    - "docs/oss/contributor-committer.md"
  reference_answer: "The nomination is prepared jointly by the contributor and a committer, based on demonstrated past merit; the recommended template should link to at most about 7 good issues/PRs so the evaluation takes no more than 15 minutes. The committer files the election via the Eclipse project page ('Nominate a Committer'), which automatically mails the dev list. The election runs for 1 week, during which project committers vote accept, deny or abstain with a reason. Afterwards the project leads and the PMC decide based on the votes, and if accepted there is paperwork with the Eclipse Foundation."
  key_points:
    - "Contributor and committer prepare the nomination together, using the recommended template with few (max ~7) links"
    - "A committer files the election via 'Nominate a Committer' on the Eclipse project page"
    - "The election lasts 1 week; committers vote accept/deny/abstain with a reason"
    - "Project leads and PMC decide based on the votes, followed by Eclipse Foundation paperwork"
  evidence: "After the committer election has been closed, the project leads and the project management committee (see roles) decide based on the committer votes"

- id: D10
  reviewed: false
  question: "Ich möchte bei Eclipse Tractus-X mitmachen. Welche Accounts brauche ich und was muss ich dort einrichten, damit meine Beiträge angenommen werden?"
  lang: de
  category: procedural
  expected_sources:
    - "docs/getting-started.md"
    - "docs/dev_faq.md"
  reference_answer: "You need a GitHub account and an Eclipse Foundation account; without them you only have read-only access. On GitHub, enable two-factor authentication and add the email address you use for your Eclipse account. Create the Eclipse Foundation account with the same email you use on GitHub (e.g. your company email), sign the Eclipse Contributor Agreement (ECA), and add your GitHub ID to your Eclipse profile under Social Media Links. Mismatched emails or a missing ECA are typical causes of a failing ECA check on PRs."
  key_points:
    - "GitHub account with two-factor authentication enabled"
    - "Eclipse Foundation account using the same email address as on GitHub"
    - "Sign the Eclipse Contributor Agreement (ECA)"
    - "Add the GitHub ID to the Eclipse profile (Social Media Links)"
  evidence: "Use the same email address that you use in GitHub for your contributions"

- id: D11
  reviewed: false
  question: "We want our feature to be picked up in the next release's planning session. What has to be set on the GitHub issue beforehand?"
  lang: en
  category: procedural
  expected_sources:
    - "docs/oss/release-process.md"
  reference_answer: "For a feature to be considered at the Open Planning Day, its status must be 'Backlog' and the milestone must not yet be set, since milestones are assigned during the session. Both a contributor and a committer must be assigned, the Topic/Product field must be set, and all sections of the feature template must be filled in without deleting any. The issue should also carry the release preparation label, e.g. Prep-R26.03."
  key_points:
    - "Status set to Backlog and milestone NOT set"
    - "Both a contributor and a committer assigned"
    - "Topic/Product field set"
    - "All sections of the feature template filled (none deleted)"
  evidence: "Assignees: Both Contributor and Committer must be assigned"

- id: D12
  reviewed: false
  question: "I have an idea for a new KIT. What steps do I go through to get it proposed and published on the website?"
  lang: en
  category: procedural
  expected_sources:
    - "documentation/kit-getting-started.mdx"
    - "docs/release/trg-10/trg-10-02.mdx"
  reference_answer: "Optionally discuss the idea first with the community (KIT office hours, Matrix, discussions). Then create an issue in the sig-release repository using the 'Propose KIT' template and present it at the Open Planning Day of the target release. Build the KIT in your fork of eclipse-tractusx.github.io and submit a pull request to main that includes the KIT content, its master data entry and a changelog. The committer assigned in the sig-release ticket reviews, approves and merges the PR, creates the KIT release check issue, and the KIT appears in the target release's changelog/release notes."
  key_points:
    - "Create a sig-release issue using the 'Propose KIT' template"
    - "Present the ticket at the Open Planning Day of the target release"
    - "Submit a PR to eclipse-tractusx.github.io with the KIT, updated master data and changelog"
    - "The assigned committer reviews/merges and handles the release (release check issue, release notes)"
  evidence: "Present it in the next Open Planning Day for the target release."

- id: D13
  reviewed: false
  question: "Our KIT has been incubating for a while. What does it still need before it can become Graduated, and how do we actually apply for that?"
  lang: en
  category: cross-kit
  expected_sources:
    - "docs/release/trg-10/trg-10-04.mdx"
    - "documentation/kit-lifecycle.mdx"
    - "docs/release/trg-10/trg-10-03.mdx"
  reference_answer: "The KIT must be in the Incubating 'In Review' sub-state with all mandatory artifacts completed, pass the community review, and complete a successful case study (success story) with expert validation and approval. It must also have at least one code owner listed in CODEOWNERS who is an Eclipse committer, responsible for maintenance and support. Graduation is applied for during a release (lifecycle levels only change via a release); the PR or release ticket reviewer checks the requirements, and after merge the graduation is stated in the release notes and a graduationDate is added to the KIT master data."
  key_points:
    - "The KIT must be in the Incubating 'In Review' state with all mandatory artifacts completed"
    - "A successful case study / expert validation and approval is required"
    - "At least one CODEOWNERS entry who is an Eclipse committer"
    - "Apply during a release; the lifecycle level only changes via a release"
  evidence: "A KIT in order to achieve graduation must a KIT must be at `INCUBATING - REVIEW` state."

- id: D14
  reviewed: false
  question: "I'm reviewing a PR from an external contributor: it's about 1,500 lines and the updated DEPENDENCIES file lists a new library as 'restricted' without an issue number. What has to happen before I can merge it?"
  lang: en
  category: cross-kit
  expected_sources:
    - "docs/oss/code-reviews.md"
    - "docs/release/trg-7/trg-7-03.md"
    - "docs/release/trg-7/trg-7-00.md"
    - "docs/release/trg-7/trg-7-04.md"
    - "docs/oss/issues.md"
  reference_answer: "Because the contribution exceeds 1,000 lines, a committer must request an IP review for code contributions from the Eclipse Foundation IP Team (IP issue tracker, 'vet-project' template) and it must be approved before the PR is merged. For the 'restricted' library without an IP issue, a project committer must create the IP review for the third-party library (e.g. via the Dash tool with the review option), open a GitHub issue linking the IP issues and track it. Only committers can create valid IP issues. If any library had status 'rejected', the contribution would have to be rejected."
  key_points:
    - "More than 1,000 lines requires an approved IP review for code contributions by the EF IP Team before merging"
    - "A restricted library without an issue number needs an IP review for third-party content created by a committer (e.g. via the Dash tool)"
    - "Only committers can create valid IP issues"
    - "Libraries with status 'rejected' mean the contribution must be rejected"
  evidence: "If the contribution is larger (e.g. > 1000 loc) you have to request an IP check from the EF"

