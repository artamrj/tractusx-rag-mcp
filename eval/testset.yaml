  reference_answer: "The Modular Engineering (ME) KIT decomposes the system into modular objects and engineering tasks and defines what is to be done (tasks, interfaces, modular objects), orchestrating execution; Engineering as a Service (EaaS) is the brokerage and contracting layer that defines who performs it. When ME needs additional capacity or expertise it publishes the tasks to the EaaS marketplace, where capabilities are matched, quotations exchanged and contracts negotiated. EaaS then returns the selected provider and contract terms to ME for controlled task execution; EaaS itself does not handle the engineering execution."
  key_points:
