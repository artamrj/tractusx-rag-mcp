    - "EaaS handles matchmaking, quotation and contracting and returns the selected provider and contract terms to ME"
    - "EaaS does not execute the engineering work itself"
  evidence: "EaaS facilitates discovery, negotiation, and contracting - returning the selected provider and contract terms to ME for controlled task execution."

