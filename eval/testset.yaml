  reference_answer: "The customer creates the requirement in its requirements system, registers it as a digital twin in its DTR with a Requirements submodel, and sends a notification through the EDC to the supplier (using the Industry Core notification format with a Create/Update/Delete context). The supplier's system then requests the requirement through the EDC, and it is transferred into the supplier's DTR and submodel service. After evaluating it (status such as accept, decline or further clarification, plus an optional comment), the supplier updates the requirement and sends an update notification back via EDC. Notifications carry only technical information about creation/change/deletion; status and comments are stored in the requirement submodel."
