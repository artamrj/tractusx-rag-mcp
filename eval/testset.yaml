    - "docs-kits_versioned_docs/version-26.09/kits/puris-kit/adoption-view/adoption-view.md"
  reference_answer: "Supply Chain Disruption Notifications are intended for exceptional events like this one, to quickly inform partners (1-up/1-down) about impactful events whose impact cannot be precisely quantified yet; whether an event is extraordinary is up to the sender. They are not meant for routine changes of demand or capacity, for which DCM and PURIS are recommended. DCM covers demand and capacity on a weekly basis beyond four weeks (a tactical horizon of 1-2 years), while PURIS covers the short-term supply situation from today up to about four weeks with daily granularity. The disruption notification is an optional capability referenced by the DCM standard CX-0128 and has its own aspect model and API (CX-0146)."
  key_points:
    - "Disruption notifications are for exceptional events whose impact cannot yet be precisely quantified, not for routine demand/capacity changes"
    - "Routine changes should be handled with DCM and PURIS"
    - "DCM: weekly buckets, horizon beyond 4 weeks (tactical 1-2 years); PURIS: daily, today to about 4 weeks"
    - "Disruption notifications use their own aspect model and API (CX-0146), an optional capability referenced by CX-0128"
  evidence: "Supply Chain Disruption Notifications are recommended for exceptional circumstances and are not intended for routine communication regarding changes in demands or capacities."

- id: B13
  reviewed: false
  review_note: "Each page alone gives most of the answer, so only weakly cross-kit (both are sandbox KITs)."
  question: "We are splitting a vehicle subsystem into engineering work packages and need outside partners for some of them. Which KIT handles the work breakdown and which one handles finding and contracting a provider, and how do they hand over to each other?"
  lang: en
