    - "docs-kits_versioned_docs/version-26.09/kits/environmental-and-social-standards-kit/adoption-view.md"
    - "docs-kits_versioned_docs/version-26.09/kits/environmental-and-social-standards-kit/documentation.md"
  reference_answer: "Access depends on the degree of relationship to the incident originator (L0). Direct partners (L1) get the incident status and full information. Indirect partners (Ln) only receive anonymized information (anonymized title and description, category, status, etc.) from the previous partner, together with their distance to L0; the originator's identity and the path from L0 to Ln are neither communicated nor documented. The Clearing Agency sees the status and original intake of all incidents."
