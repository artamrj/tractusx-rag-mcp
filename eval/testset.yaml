- id: C01
  reviewed: false
  question: "My supplier hasn't put a PCF submodel on a material twin for the part we buy. How do I ask them for the carbon footprint over the connector, and how does their answer get back to me?"
  lang: en
  category: procedural
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/product-carbon-footprint-exchange-kit/software-development-view.md"
  reference_answer: "When no matching material twin or PCF submodel exists, the consumer discovers and negotiates access to the supplier's PCF Exchange API data asset (offered with cx-common:version 1.3.0 and dct:type cx-taxo:PcfExchange). It then calls GET /footprintExchange/{requestId}, passing the requestId plus manufacturerPartId and/or customerPartId (optionally dataModelVersion). The supplier later pushes the PCF back by negotiating with the consumer's connector and calling PUT /footprintExchange/{requestId} with the PCF in the body; later updates reuse the same PUT with update=true."
  key_points:
    - "Consumer discovers and negotiates the supplier's PCF Exchange API asset (dct:type cx-taxo:PcfExchange) via the catalog"
    - "Request is GET /footprintExchange/{requestId} with requestId and at least one of manufacturerPartId or customerPartId"
    - "Supplier responds asynchronously by pushing the PCF via PUT /footprintExchange/{requestId} to the consumer's endpoint"
    - "Updates to a previously requested PCF use the same PUT with update=true"
  evidence: "The consumer then requests the PCF with `GET /footprintExchange/{requestId}`. The `requestId` and at least one of `manufacturerPartId` or `customerPartId` are required."

- id: C02
  reviewed: false
  question: "A user scans the QR code on a battery and gets an ID like CX:XYZ78901:IMR18650V1. What does a passport viewer app have to do, step by step, to pull the passport from the manufacturer?"
  lang: en
  category: procedural
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/eco-pass-kit/software-development-view.md"
  reference_answer: "The ID follows CX:<manufacturerPartId>:<partInstanceId>. The app first calls the Discovery Finder to get BPN Discovery and EDC Discovery endpoints, resolves the manufacturerPartId to the owner's BPN and the BPN to its EDC endpoints. It then filters those EDCs' catalogs for the data.core.digitalTwinRegistry asset type, negotiates access to the Digital Twin Registry and looks up the twin by the partInstanceId. Finally it negotiates the passport submodel asset referenced in the SUBMODEL-3.0 endpoint's subprotocolBody, obtains an EDR token and queries the href URL through the provider's data plane proxy."
  key_points:
    - "ID format is CX:<manufacturerPartId>:<partInstanceId>"
    - "Discovery: manufacturerPartId resolved via BPN Discovery to a BPN, BPN resolved via EDC Discovery to connector endpoints"
    - "Catalogs filtered for type data.core.digitalTwinRegistry; DTR negotiated and twin looked up by partInstanceId"
    - "Submodel asset (from SUBMODEL-3.0 subprotocolBody) negotiated, EDR token obtained, data fetched from href via provider data plane proxy"
  evidence: "At the beginning we start calling the `Discovery Service` which is responsible for giving us the urls from the `BPN Discovery` and the `EDC Discovery`"

- id: C03
  reviewed: false
  question: "Our forwarder consolidates several of our dispatch notes onto one shipment. How do we end up with a transport emission value per dispatch note that we can feed into our PCF calculation?"
  lang: en
  category: procedural
  expected_sources:
    - "docs-kits_versioned_docs/version-26.09/kits/pcf-data-acquisition-kit/development-view/development-logistics.md"
    - "docs-kits_versioned_docs/version-26.09/kits/pcf-data-acquisition-kit/adoption-view/data-acquisition-logistics.md"
  reference_answer: "Dispatch note and handling unit data (with weights) are uploaded to a logistics platform, which creates a Unique Consignment Reference (UCR) for the shipment. After delivery, the logistics service provider enters the emissions at UCR level, from primary data (fuel, distance, mode, load weight) or, if unavailable, via the Transport Carbon Calculator using GLEC emission factors. The platform then allocates the UCR-level footprint back to each dispatch note by weight distribution, and the customer queries the footprint per dispatch note from its PCF management system via an iLEAP-based API."
  key_points:
    - "DN/HU data are uploaded to the logistics platform and a UCR is created for the consolidated shipment"
    - "The logistics service provider reports emissions only at UCR level (primary data, or Transport Carbon Calculator with GLEC factors)"
    - "The platform allocates UCR emissions to individual dispatch notes based on weight distribution"
    - "Customer queries the per-DN footprint via an iLEAP-based API from its PCF management system"
  evidence: "The logistics platform automatically distributes the UCR-level footprint back to each individual DN covered by that UCR based on the weight distribution."

